<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=index.html">
    <title>FB Abogados | Firma Jurídica</title>
    <script>window.location.href = 'index.html';</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0b0d10;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 85% 40%, rgba(170, 119, 28, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 15% 85%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 2px, transparent 2px, transparent 5px),
                radial-gradient(ellipse at center, #13171f 0%, #08090c 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: #d4af37;
            margin-bottom: 5px;
            font-size: 2.4rem;
            text-align: center;
        }

        p {
            color: #9ca3af;
            margin-bottom: 35px;
            font-size: 1rem;
            text-align: center;
            max-width: 650px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: #12151c;
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card h3 {
            color: #f3e5ab;
            font-size: 1.05rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo-img {
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 22px rgba(212, 175, 55, 0.45));
        }

        .btn-back {
            margin-top: 40px;
            background: linear-gradient(135deg, #f5eaaf 0%, #d4af37 50%, #aa771c 100%);
            color: #000;
            font-weight: 700;
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            filter: brightness(1.15);
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h1>FB ABOGADOS</h1>
    <p>Despacho Jurídico Especializado — Lic. Edith Bernal Martínez</p>

    <div class="preview-grid">
        <div class="card">
            <h3>FB ABOGADOS</h3>
            <img src="assets/logo.png" onerror="this.onerror=null; this.src='assets/logo.jpeg'; this.onerror=function(){this.src='logo.png'; this.onerror=function(){this.src='logo.jpeg';}};" alt="FB Abogados Logo" class="logo-img">
        </div>
    </div>

    <a href="index.html" class="btn-back">Ver Sitio Web Completo →</a>

</body>
</html>
